[project]
name = "visiontriage"
version = "0.1.0"
description = "Agentic incident analyst for industrial cameras: Anomalib CV tools behind MCP, orchestrated by a LangGraph state machine, evaluated with LangSmith."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "fastmcp>=2",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# Heavy CV stack, installed only where inference actually runs:
#   uv sync --extra cv
cv = [
    "anomalib>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visiontriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
