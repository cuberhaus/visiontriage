[project]
name = "visiontriage"
version = "0.2.0"
description = "Local CV failure analyst: investigates completed model evaluation runs and drafts evidence-backed findings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2",
    "langchain-core>=1.0",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.scripts]
visiontriage = "visiontriage.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visiontriage", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
